{{define "seo-head"}}<meta name="description" content="{{.Description}}"><meta name="robots" content="{{if .NoIndex}}noindex, follow{{else}}index, follow{{end}}"><link rel="canonical" href="{{.Canonical}}">{{range .Alternates}}<link rel="alternate" hreflang="{{.Lang}}" href="{{.URL}}">{{end}}<meta property="og:site_name" content="Salafi Network"><meta property="og:title" content="{{.Title}}"><meta property="og:description" content="{{.Description}}"><meta property="og:url" content="{{.Canonical}}"><meta property="og:type" content="{{.Kind}}"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{.Title}}"><meta name="twitter:description" content="{{.Description}}">{{end}}
